services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: vision
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vision-local-only}
      POSTGRES_DB: vision
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vision"]
      interval: 5s
      retries: 10
  web:
    build: .
    ports: ["127.0.0.1:3000:3000"]
    environment:
      APP_MODE: ${APP_MODE:-demo}
      DATABASE_URL: postgresql://vision:${POSTGRES_PASSWORD:-vision-local-only}@db:5432/vision
      RESTAURANT_ID: ${RESTAURANT_ID:-my-restaurant}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:-}
      SESSION_SECRET: ${SESSION_SECRET:-}
      EDGE_API_KEY: ${EDGE_API_KEY:-}
      CRON_SECRET: ${CRON_SECRET:-}
      N8N_WEBHOOK_URL: ${N8N_WEBHOOK_URL:-}
      N8N_WEBHOOK_SECRET: ${N8N_WEBHOOK_SECRET:-}
    depends_on:
      db:
        condition: service_healthy
  n8n:
    image: docker.n8n.io/n8nio/n8n:stable
    profiles: ["automation"]
    ports: ["127.0.0.1:5678:5678"]
    volumes: ["n8ndata:/home/node/.n8n"]
volumes:
  pgdata:
  n8ndata:
